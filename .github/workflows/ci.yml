name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find . -type d \( -name .git -o -name node_modules \) -prune -o -type f -name '*.mjs' -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file" || exit 1
            done
      - run: npm test
      - run: node scripts/check-pii.mjs
